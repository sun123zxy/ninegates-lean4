name = "ninegates"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Ninegates"]
moreLeanArgs = ["-j2", "-M4096"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "repl"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Ninegates"

[[lean_lib]]
name = "ComparatorChallenges"
